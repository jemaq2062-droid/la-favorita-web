services:
  - type: web
    name: la-favorita-web
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4.1-mini

      - key: INITIAL_CATALOG_FILE
        value: data/catalog-bootstrap.json
      - key: SEED_DEMO_PRODUCTS
        value: "false"
      - key: SAVE_QUOTE_HISTORY
        value: "false"
